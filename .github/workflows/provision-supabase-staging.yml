name: Provision and validate Supabase database staging

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create the project, resume migration, or validate the existing database
        type: choice
        options: [validate, resume, provision]
        default: validate
        required: true
      confirm_project_creation:
        description: For provision only, enter exactly CREATE SYNTHETIC STAGING PROJECT
        type: string
        required: false
      reviewed_commit:
        description: Exact 40-character commit SHA that was reviewed for this run
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-staging
  cancel-in-progress: false

jobs:
  reviewed-commit-gate:
    name: Exact reviewed commit gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify github.sha before protected environment access
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"

  provision-and-validate:
    name: Supabase staging security gate
    needs: reviewed-commit-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: supabase-staging
    env:
      SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      SUPABASE_FREE_TIER_APPROVAL: ${{ vars.SUPABASE_FREE_TIER_APPROVAL }}
      SUPABASE_FREE_TIER_APPROVED_BY: ${{ vars.SUPABASE_FREE_TIER_APPROVED_BY }}
      SUPABASE_FREE_TIER_APPROVED_AT: ${{ vars.SUPABASE_FREE_TIER_APPROVED_AT }}
      SUPABASE_STAGING_APPROVAL_MODE: ${{ vars.SUPABASE_STAGING_APPROVAL_MODE }}
      SUPABASE_STAGING_CHANGE_APPROVAL: ${{ vars.SUPABASE_STAGING_CHANGE_APPROVAL }}
      SUPABASE_STAGING_APPROVED_COMMIT: ${{ vars.SUPABASE_STAGING_APPROVED_COMMIT }}
      SUPABASE_STAGING_APPROVED_BY: ${{ vars.SUPABASE_STAGING_APPROVED_BY }}
      SUPABASE_STAGING_APPROVED_AT: ${{ vars.SUPABASE_STAGING_APPROVED_AT }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      STAGING_PROJECT_NAME: ai-lead-operator-staging-only-synthetic
      STAGING_PROJECT_REGION: us-east-2
      BASELINE_COMMIT: b24bb69f4ece0c72ac7269d180afcb6ee2a13626
    steps:
      - name: Check out the private repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Verify recorded staging approval
        run: node scripts/verify-supabase-staging-run.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository release gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run validate:artifact

      - name: Provision, resume, or validate database staging
        id: staging
        shell: bash
        env:
          STAGING_OPERATION: ${{ inputs.operation }}
          CONFIRM_PROJECT_CREATION: ${{ inputs.confirm_project_creation }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORGANIZATION_SLUG: ${{ secrets.SUPABASE_ORGANIZATION_SLUG }}
          STAGING_OWNER_PASSWORD: ${{ secrets.STAGING_OWNER_PASSWORD }}
          STAGING_STAFF_PASSWORD: ${{ secrets.STAGING_STAFF_PASSWORD }}
          STAGING_VIEWER_PASSWORD: ${{ secrets.STAGING_VIEWER_PASSWORD }}
        run: node scripts/provision-supabase-staging.mjs

      - name: Run hosted Supabase security tests
        if: steps.staging.outputs.ready == 'true'
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ steps.staging.outputs.project_ref }}
          SUPABASE_PROJECT_URL: ${{ steps.staging.outputs.project_url }}
          SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORGANIZATION_SLUG: ${{ secrets.SUPABASE_ORGANIZATION_SLUG }}
          STAGING_OWNER_PASSWORD: ${{ secrets.STAGING_OWNER_PASSWORD }}
          STAGING_STAFF_PASSWORD: ${{ secrets.STAGING_STAFF_PASSWORD }}
          STAGING_VIEWER_PASSWORD: ${{ secrets.STAGING_VIEWER_PASSWORD }}
        run: node scripts/hosted-supabase-security.mjs

      - name: Publish redacted validation report
        if: always() && hashFiles('artifacts/supabase-staging-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supabase-staging-security-report
          path: artifacts/supabase-staging-report.json
          if-no-files-found: error
          retention-days: 14
